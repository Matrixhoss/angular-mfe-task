<section class="records-page">
  <header class="records-header">
    <h1>App One - Records</h1>

    <button class="add-record-button" type="button">
      <img src="/icons/add.svg" alt="" />
      <span>Add Record</span>
    </button>
  </header>

  <div class="table-filters" aria-label="Table filters">
    <label>
      <span>Search</span>
      <input
        type="search"
        placeholder="Name, email, or department"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>

    <label>
      <span>Status</span>
      <select [value]="statusFilter()" (change)="onStatusChange($event)">
        <option value="All">All statuses</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </label>
  </div>

  @if (records()) {
    @if (sortedRecords().length > 0) {
      <app-records-table
        [records]="visibleRecords()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sortChange)="sortBy($event)"
      />

      <app-pagination
        [currentPage]="currentPage()"
        [pageSize]="pageSize"
        [totalRecords]="sortedRecords().length"
        (pageChange)="currentPage.set($event)"
      />
    } @else {
      <p class="empty-message">No matching records found.</p>
    }
  } @else {
    <p class="loading-message" role="status">Loading records...</p>
  }
</section>
