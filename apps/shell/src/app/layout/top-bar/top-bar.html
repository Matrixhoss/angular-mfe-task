<header class="top-bar">
  <span class="top-bar__brand">Company Portal</span>

  <button class="top-bar__user" type="button" aria-label="Open user menu">
    <span class="top-bar__avatar" aria-hidden="true">JS</span>
    <span>{{ userName() }}</span>
    <svg
      class="top-bar__chevron"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="m7 10 5 5 5-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</header>
